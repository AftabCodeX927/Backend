<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & Post request</title>
</head>
<body style="background-color: rgb(232, 232, 0);">
    <form method="get" action="http://localhost:8080/register">
        <h2>GET request form</h2>
        <input type="text" placeholder="enter username" name="userword">
        <input type="password" placeholder="enter password" name="password">
        <button>Submit</button>
    </form>    
        <hr>
    <form method="post" action="http://localhost:8080/register">
        <h2>POST request form</h2>
        <input type="text" placeholder="enter username" name="user">
        <input type="password" placeholder="enter password" name="pass">
        <button>Submit</button>
    </form>

</body>
</html>
